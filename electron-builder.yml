appId: com.claudeui.app
productName: ClaudeUI
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # electron-builder does NOT read .gitignore — without these negations the
  # asar packs the whole working tree: developer-local .claude/ (settings,
  # logs, saved mockups), .cache/ (session screenshots, restored CLI
  # binaries), the ~2 GB vendor/ tree (already shipped via extraResources),
  # docs, patches, scripts, and stray logs. That both doubles the shipped
  # size and leaks local session data into any built distributable.
  - '!.cache/**'
  - '!.claude/**'
  - '!vendor/**'
  - '!docs/**'
  - '!patch/**'
  - '!scripts/**'
  - '!dist/**'
  - '!.github/**'
  - '!**/*.log'
  - '!*.md'
  # out/web is shipped as extraResources (resources/web) and prod resolves it
  # there (remote-server getWebClientDir) — the asar copy is never read.
  - '!out/web/**'
extraResources:
  # Ship the rebundled Bun binary + version metadata + native addons that
  # the Electron main process loads directly (audio-capture.node etc. — see
  # src/main/services/voice-capture.ts). The source cli.js also present in
  # vendor/claude-cli/ is a debug artifact (already baked into bun-claude.exe
  # by scripts/rebundle-cli.mjs), no need to duplicate ~13 MB.
  - from: vendor/claude-cli
    to: claude-cli
    filter:
      - bun-claude*
      - version.json
      - vendor/**/*.node
  - from: vendor/opencode-cli
    to: opencode-cli
    filter:
      - opencode*
      - version.json
  # pi standalone build resolves runtime assets (native addons, wasm, themes,
  # export-html template) relative to the executable — ship the vendored dir
  # minus docs/examples.
  - from: vendor/pi-cli
    to: pi-cli
    filter:
      - '**/*'
      - '!docs/**'
      - '!examples/**'
  - from: out/web
    to: web
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
win:
  executableName: claudui
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No `publish:` block on purpose. There is no electron-updater dependency, so
# nothing consumes an update feed; the scaffolded placeholder feed pointed at an
# uncontrolled domain (example.com) and would silently become a live update
# channel the moment auto-update was wired up. Re-add it only together with a
# domain we own.
