appId: com.electron.app
productName: ClaudeUI
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # Ship the rebundled Bun binary + version metadata + native addons that
  # the Electron main process loads directly (audio-capture.node etc. — see
  # src/main/services/voice-capture.ts). The source cli.js also present in
  # vendor/claude-cli/ is a debug artifact (already baked into bun-claude.exe
  # by scripts/rebundle-cli.mjs), no need to duplicate ~13 MB.
  - from: vendor/claude-cli
    to: claude-cli
    filter:
      - bun-claude*
      - version.json
      - vendor/**/*.node
  - from: vendor/opencode-cli
    to: opencode-cli
    filter:
      - opencode*
      - version.json
  # Hosted-tools opencode plugin (Phase 5c Part B) — copied at runtime into
  # ~/.config/opencode/plugin/ by ensureOpencodePlugin(). Shipped as a plain
  # .js so opencode's Bun runtime loads it directly.
  - from: src/main/opencode/plugin
    to: opencode-plugin
    filter:
      - claudeui.plugin.js
  - from: out/web
    to: web
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
win:
  executableName: claudui
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
