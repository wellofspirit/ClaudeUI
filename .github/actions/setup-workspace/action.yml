name: Set up workspace
description: >-
  Node, bun, the install/CLI/Codex/Electron caches, `bun install` (with its
  postinstall) and the native rebuild: everything a CI job needs before it
  can typecheck, test or build. Shared by every job in ci.yml, on Linux, macOS
  and Windows (the Windows-only steps mirror pre-release.yml's build job).
runs:
  using: composite
  steps:
    # The release workflows' Windows exclusions: real-time scanning of every
    # spawned node/bun and every file the install writes slows a cold runner.
    - name: Exclude workspace from Windows Defender
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
        Add-MpPreference -ExclusionPath "$env:USERPROFILE\.claude\ui\harnesses"
        Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
        Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"
        Add-MpPreference -ExclusionProcess "bun.exe"
        Add-MpPreference -ExclusionProcess "node.exe"

    - uses: actions/setup-node@v7
      with:
        # Pinned to 24.15.0 to match the release workflows: Node 24.16.0 ships a
        # libuv that aborts on Windows when fs.watch() targets a single file,
        # cascading vitest workers to "failed". Kept identical here for parity.
        node-version: 24.15.0

    # Third-party actions are pinned by commit: tags are movable. Re-vet before bumping.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Not on Windows: extracting the cache took longer than a fresh download
    # (measured for pre-release.yml, 2026-10-03).
    - name: Cache bun install
      if: runner.os != 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Read claude CLI version
      id: cli-version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').claudeCliVersion")" >> "$GITHUB_OUTPUT"

    - name: Cache claude CLI source binary
      uses: actions/cache@v6
      with:
        path: .cache/claude-cli
        key: ${{ runner.os }}-claude-cli-src-${{ steps.cli-version.outputs.version }}

    - name: Read codex CLI version
      id: codex-version
      shell: bash
      run: echo "version=$(node -p "require('./src/shared/harness-manifests/codex.json').tested")" >> "$GITHUB_OUTPUT"

    # postinstall installs the tested opencode, pi and Codex into ClaudeUI's
    # managed store (ADR-082 §8). Codex is the large one (two ~100 MB
    # archives), so its version directory is cached; a restored directory
    # with a valid install.json satisfies ensure-codex without a download.
    # No restore-keys: another pin's directory is never this pin's.
    - name: Cache codex harness
      uses: actions/cache@v6
      with:
        path: ~/.claude/ui/harnesses/codex/${{ steps.codex-version.outputs.version }}
        key: ${{ runner.os }}-${{ runner.arch }}-codex-harness-${{ steps.codex-version.outputs.version }}

    - name: Cache Electron binaries
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-electron-

    # Full install (runs postinstall: install-app-deps + ensure-cli, and
    # ensure-opencode/pi/codex into the runner's managed store), mirroring the
    # release workflows. postinstall's ensure-cli also proves the
    # cli.js patches still APPLY against the pinned claudeCliVersion — a patch
    # that no longer applies fails the install and turns CI red. (Behavioural
    # correctness of the applied patches is a separate, live-only concern:
    # `bun run test:patch` locally, with real Claude credentials — deliberately
    # not a CI job.)
    - name: Install dependencies
      shell: bash
      run: bun install

    # postinstall already runs install-app-deps; this explicit, idempotent re-run
    # makes a native rebuild failure its own visible step. It rebuilds node-pty for
    # the Electron ABI (better-sqlite3 13 ships prebuilt binaries that load under
    # both Node and Electron).
    - name: Rebuild native modules
      shell: bash
      run: bun run rebuild:native
