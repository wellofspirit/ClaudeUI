name: CI

# Pull-request / feature-branch gates (H21). Before this workflow existed NOTHING
# ran on a PR: lint and format:check ran in no workflow at all, and the only tests
# ran inside the release/pre-release build jobs — i.e. AFTER a push to main /
# pre-release had already started publishing a tag. This workflow runs the full
# headless gate set on every PR, independently
# of the release path (it publishes nothing and does not gate the release
# workflows, which keep their own build+test step before the release job).
#
# Deliberately scoped to ubuntu-latest: it is the fast/cheap safety net that
# catches typecheck/lint/format/logic regressions BEFORE merge. Cross-OS coverage
# (windows-2022 + macos) still runs in release.yml / pre-release.yml before any
# tag is published, so a Windows-only regression is caught at push-to-pre-release
# time. Add an os matrix here if PR-time Windows coverage becomes worth the cost.
#
# The build steps at the end are gates, not artifacts: electron-vite + the web
# bundle catch vite-config regressions that tests cannot see, and the server
# steps are the ONLY workflow anywhere that runs `build:server*` and its
# bun:sqlite conformance arm (`verify:sqlite`) — the release workflows ship the
# same linux-x64 executable this job proves buildable and bootable.

on:
  # Pull requests only (owner, 2026-09-22): main and pre-release have their own
  # release pipelines, and a push to any other branch runs nothing until it is
  # opened as a PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, lint, format and the build gates in one job; the tests run beside
  # it in `tests`, split three ways. The wall time is the slower of the two
  # instead of their sum (one serial job took ~9.5 min, ~6 of it tests).
  gates:
    name: Typecheck, lint, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # The raw bundler pass the release workflows' "Build app" step runs. Not
      # `bun run build`: that also rebuilds the CLI, which install already did.
      - name: Build (electron + web)
        run: |
          bunx electron-vite build
          bunx vite build --config vite.web.config.ts

      # `build:server` runs verify:sqlite before bundling; the compile step
      # produces the same host-native linux-x64 executable the release
      # workflows ship, and --help proves it boots outside a repo checkout.
      - name: Build server artifacts (bundle + linux executable)
        run: |
          bun run build:server
          bun run build:server:compile
          ./dist/server-bin/claudeui-server --help > /dev/null

  tests:
    name: Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: a failure in one must not cancel the others and
      # hide their results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      # The `browser` vitest project (Layer 2b layout tests) drives real headless
      # Chromium, which `bun install` does not fetch and the runner image does not
      # ship. Here, not in setup-workspace: only this job runs tests. The headless
      # shell is all a headless run uses; the browser build is tied to the
      # playwright version, so that keys the cache. The apt packages `--with-deps`
      # adds are not cached, so the install always runs (no download on a hit).
      - name: Read playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium for the browser tests
        run: bunx playwright install --with-deps --only-shell chromium

      # unit + unit-node + component + e2e + browser + git, split by file across shards.
      - name: Tests (unit + component + e2e + browser + git)
        run: bun run test:ci --shard=${{ matrix.shard }}/3
