name: CI

# Pull-request / feature-branch gates (H21). Before this workflow existed NOTHING
# ran on a PR: lint and format:check ran in no workflow at all, and the only tests
# ran inside the release/pre-release build jobs — i.e. AFTER a push to main /
# pre-release had already started publishing a tag. This workflow runs the full
# headless gate set on every PR, independently
# of the release path (it publishes nothing and does not gate the release
# workflows, which keep their own build+test step before the release job).
#
# The gates job runs on ubuntu-latest. The tests run on Linux, macOS and
# Windows, so an OS-specific regression is caught BEFORE merge rather than at
# push-to-pre-release time (release.yml / pre-release.yml keep their own test
# step before any tag is published).
#
# The build steps at the end are gates, not artifacts: the electron-vite build
# (one renderer build, desktop + web) catches vite-config regressions that
# tests cannot see, and the server steps are the ONLY workflow anywhere that
# runs `build:server*` and its bun:sqlite conformance arm (`verify:sqlite`) — the
# release workflows ship the same linux-x64 executable this job proves buildable
# and bootable.

on:
  # Pull requests only (owner, 2026-09-22): main and pre-release have their own
  # release pipelines, and a push to any other branch runs nothing until it is
  # opened as a PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, lint, format and the build gates in one job; the tests run beside
  # it in `tests`, split three ways. The wall time is the slower of the two
  # instead of their sum (one serial job took ~9.5 min, ~6 of it tests).
  gates:
    name: Typecheck, lint, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Prettier's cache compares file CONTENT (format:check passes
      # --cache-strategy content), so a cache from an earlier run is safe on a
      # fresh checkout whose mtimes are all new: 58 s cold, a few seconds warm.
      # Saved under this commit's key, restored from the newest earlier one.
      - name: Cache prettier
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: ${{ runner.os }}-prettier-${{ hashFiles('bun.lock', '.prettierrc.yaml', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prettier-${{ hashFiles('bun.lock', '.prettierrc.yaml', '.prettierignore') }}-

      - name: Format check
        run: bun run format:check

      # The raw bundler pass the release workflows' "Build app" step runs. Not
      # `bun run build`: that also rebuilds the CLI, which install already did.
      - name: Build (electron-vite)
        run: bunx electron-vite build

      # `build:server` runs verify:sqlite before bundling; the compile step
      # produces the same host-native linux-x64 executable the release
      # workflows ship, and --help proves it boots outside a repo checkout.
      - name: Build server artifacts (bundle + linux executable)
        run: |
          bun run build:server
          bun run build:server:compile
          ./dist/server-bin/claudeui-server --help > /dev/null

  tests:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every job reports: a failure in one must not cancel the others and
      # hide their results.
      fail-fast: false
      matrix:
        include:
          # The `browser` project (Layer 2b layout tests, real headless Chromium) runs
          # once, on Linux, in its own job: only it needs the Chromium install.
          - os: ubuntu-latest
            label: 'Browser'
            script: test:browser
            shard: ''
            browser: true
          # Every other project, split by file: 3 shards per OS. macOS and Windows
          # skip `browser` as the release workflows do (its layout is pinned to
          # Linux's font, docs/testing-strategy.md, Layer 2b). Each shard repeats
          # the install (~1 min Linux/macOS, ~2.5 min Windows).
          - os: ubuntu-latest
            label: 'Linux 1/3'
            script: test:ci:no-browser
            shard: '--shard=1/3'
          - os: ubuntu-latest
            label: 'Linux 2/3'
            script: test:ci:no-browser
            shard: '--shard=2/3'
          - os: ubuntu-latest
            label: 'Linux 3/3'
            script: test:ci:no-browser
            shard: '--shard=3/3'
          - os: macos-latest
            label: 'macOS 1/3'
            script: test:ci:no-browser
            shard: '--shard=1/3'
          - os: macos-latest
            label: 'macOS 2/3'
            script: test:ci:no-browser
            shard: '--shard=2/3'
          - os: macos-latest
            label: 'macOS 3/3'
            script: test:ci:no-browser
            shard: '--shard=3/3'
          # windows-2022, not windows-latest: node-gyp cannot find VS2026 to
          # rebuild node-pty (see pre-release.yml).
          - os: windows-2022
            label: 'Windows 1/3'
            script: test:ci:no-browser
            shard: '--shard=1/3'
          - os: windows-2022
            label: 'Windows 2/3'
            script: test:ci:no-browser
            shard: '--shard=2/3'
          - os: windows-2022
            label: 'Windows 3/3'
            script: test:ci:no-browser
            shard: '--shard=3/3'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      # The `browser` vitest project (Layer 2b layout tests) drives real headless
      # Chromium, which `bun install` does not fetch and the runner image does not
      # ship. Here, not in setup-workspace: only the Browser job needs it. The headless
      # shell is all a headless run uses; the browser build is tied to the
      # playwright version, so that keys the cache. The apt packages `--with-deps`
      # adds are not cached, so the install always runs (no download on a hit).
      # The Browser job only: no other job runs the `browser` project.
      - name: Read playwright version
        if: matrix.browser
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache playwright browsers
        if: matrix.browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium for the browser tests
        if: matrix.browser
        run: bunx playwright install --with-deps --only-shell chromium

      # The Browser job: the `browser` project. Every other job: unit, unit-node,
      # unit-forks, component, e2e and git, split by file across its OS's shards.
      - name: Tests
        shell: bash
        run: bun run ${{ matrix.script }} ${{ matrix.shard }}
