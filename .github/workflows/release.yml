name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
      - '.prettierrc.yaml'
      - '.prettierignore'
      - '.eslintrc.*'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: bump
        run: |
          # Major.minor comes from package.json; patch auto-increments from the
          # latest stable tag on that major.minor line (no hyphen = no pre suffix)
          PKG_MM=$(jq -r .version package.json | cut -d. -f1,2)
          LATEST_TAG=$(git tag -l "v${PKG_MM}.*" --sort=-v:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT="${PKG_MM}.0"
          else
            PATCH="${LATEST_TAG##*.}"
            NEXT="${PKG_MM}.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' --no-merges)
          else
            LOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges)
          fi
          # Write to file to preserve newlines, then encode for output
          echo "$LOG" > /tmp/changelog.txt
          {
            echo 'changelog<<CHANGELOG_EOF'
            cat /tmp/changelog.txt
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            zip_name: ClaudeUI-${{ needs.version.outputs.version }}-mac-arm64.zip
            build_dir: dist/mac-arm64
            server_name: claudeui-server-${{ needs.version.outputs.version }}-mac-arm64
          # Pinned to windows-2022: windows-latest migrated to Windows Server
          # 2025 which ships only Visual Studio 2026. node-gyp (11.x, bundled via
          # electron-builder install-app-deps) hard-codes its supported VS years
          # to [2019, 2022], so it can't detect VS2026 and the node-pty rebuild
          # fails with "Could not find any Visual Studio installation to use".
          # Revisit once node-gyp whitelists VS2026.
          - os: windows-2022
            platform: win
            zip_name: ClaudeUI-${{ needs.version.outputs.version }}-win-x64.zip
            build_dir: dist/win-unpacked
            server_name: claudeui-server-${{ needs.version.outputs.version }}-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"
          Add-MpPreference -ExclusionProcess "bun.exe"
          Add-MpPreference -ExclusionProcess "node.exe"

      - uses: actions/setup-node@v7
        with:
          # Pinned to 24.15.0: Node 24.16.0 ships a libuv that aborts on Windows
          # (Assertion failed: !_wcsnicmp(filename, dir, dirlen), src/win/fs-event.c:72)
          # when fs.watch() targets a single file, crashing vitest workers and
          # cascading unrelated suites to "failed". 24.15.0 is the last good runner
          # Node. Revisit once a Node 24.x lands with the libuv fix.
          node-version: 24.15.0

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Read claude CLI version
        id: cli-version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').claudeCliVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache claude CLI source binary
        uses: actions/cache@v6
        with:
          path: .cache/claude-cli
          key: ${{ runner.os }}-claude-cli-src-${{ steps.cli-version.outputs.version }}

      - name: Read codex CLI version
        id: codex-version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').codexCliVersion")" >> "$GITHUB_OUTPUT"

      # No restore-keys: `cacheValid` rehashes every pinned payload, so a partial
      # hit from another pin is a guaranteed re-download rather than a saving.
      - name: Cache codex CLI binaries
        uses: actions/cache@v6
        with:
          path: vendor/codex-cli
          key: ${{ runner.os }}-${{ runner.arch }}-codex-cli-${{ steps.codex-version.outputs.version }}

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Run tests
        run: bun run test:ci

      - name: Build app
        run: |
          bun run typecheck
          bunx electron-vite build
          bunx vite build --config vite.web.config.ts

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: |
          bunx electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Signs with the self-signed "ClaudeUI Dev" identity when the MAC_CERT_*
      # secrets are configured, so TCC grants (mic, App Management, ...) keyed on
      # identifier + certificate root survive updates. Falls back to ad-hoc when
      # the secrets are absent (forks), which re-prompts on every build.
      - name: Import signing identity (macOS)
        if: matrix.platform == 'mac'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "MAC_CERT_P12 secret not set; falling back to ad-hoc signing."
            exit 0
          fi
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          printf '%s' "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # codesign rejects identities whose root isn't trusted ("no identity
          # found" despite the import), so trust the self-signed root for code
          # signing in the admin domain — runners have passwordless sudo.
          security find-certificate -a -p build.keychain > "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          rm -f "$RUNNER_TEMP/signing-cert.pem"
          # Allow codesign to use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain > /dev/null
          security list-keychains -d user -s build.keychain login.keychain
          # Debug: show what the import actually produced (names+hashes only)
          security find-identity build.keychain
          # find-identity without -v: the self-signed root is untrusted on the
          # runner, which is fine for signing but filters it from "valid".
          IDENTITY=$(security find-identity -p codesigning build.keychain | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "Cert imported but no codesigning identity found" >&2
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign (macOS)
        if: matrix.platform == 'mac'
        run: |
          codesign --force --deep --sign "${MAC_SIGN_IDENTITY:--}" "${{ matrix.build_dir }}/ClaudeUI.app"
          codesign --verify --deep --verbose=2 "${{ matrix.build_dir }}/ClaudeUI.app"

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: |
          bunx electron-builder --win --dir

      - name: Zip build output (macOS)
        if: matrix.platform == 'mac'
        run: |
          cd "${{ matrix.build_dir }}"
          zip -r -y "../../${{ matrix.zip_name }}" .

      - name: Zip build output (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.build_dir }}/*" -DestinationPath "${{ matrix.zip_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}

      # The headless `claudeui-server` for THIS host, compiled from the same tree
      # and the same `out/web` bundle the desktop package above already produced
      # (`build:server:compile` only checks that bundle exists; `verify:sqlite`
      # runs inside it). Host-native, no `--target`: bun cannot extract a foreign
      # runtime from a Windows host (ADR-061 §4) and neither leg needs one.
      #
      # Unlike the linux legs below, these two DO carry `vendor/claude-cli`. The
      # rebundled `bun-claude` exists on mac and windows (ADR-006), and
      # `locateBunClaude()` reads `<appPath>/vendor/claude-cli/bun-claude[.exe]`
      # off the very app path `resolveAppPath()` (src/server/main.ts) settles on
      # for a compiled executable — the directory holding `out/web`, i.e. the
      # stage root — so the staged layout is runnable as shipped, exactly like
      # the other three engines. What the server does NOT carry is a Claude
      # sign-in: `setHostAuth(null)` leaves that seam empty, so cli.js uses the
      # deployment box's own credentials.
      - name: Build server executable (macOS)
        if: matrix.platform == 'mac'
        run: |
          bun run build:server:compile
          ./dist/server-bin/claudeui-server --help > /dev/null

      # zip, not tar.gz: it matches the desktop artifact for these hosts and is
      # the same tool the desktop step uses. `-y` keeps symlinks as links, and
      # the unix mode bits ride in the zip entries, so `unzip`/Finder restore the
      # executable bit — Python's `zipfile` does not, which the release note says.
      - name: Assemble server zip (macOS)
        if: matrix.platform == 'mac'
        run: |
          STAGE="${{ matrix.server_name }}"
          mkdir "$STAGE"
          cp -r dist/server-bin/. "$STAGE/"
          mkdir "$STAGE/vendor"
          cp -r vendor/claude-cli "$STAGE/vendor/claude-cli"
          cp -r vendor/opencode-cli "$STAGE/vendor/opencode-cli"
          cp -r vendor/pi-cli "$STAGE/vendor/pi-cli"
          cp -r vendor/codex-cli "$STAGE/vendor/codex-cli"
          zip -r -y "$STAGE.zip" "$STAGE"

      # pwsh does not abort on a non-zero NATIVE exit code, and only the last
      # command's code reaches the runner — so each one is checked explicitly.
      - name: Build server executable (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          bun run build:server:compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\server-bin\claudeui-server.exe --help > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # `Compress-Archive`, the same tool as the desktop windows step. Copying a
      # directory onto a path that does not exist yet creates it as the copy, so
      # the stage root needs no separate mkdir; the archive keeps that root
      # folder, mirroring the linux tarballs.
      - name: Assemble server zip (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $stage = "${{ matrix.server_name }}"
          Copy-Item -Recurse -Path dist/server-bin -Destination $stage
          New-Item -ItemType Directory -Path "$stage/vendor" | Out-Null
          Copy-Item -Recurse -Path vendor/claude-cli -Destination "$stage/vendor/claude-cli"
          Copy-Item -Recurse -Path vendor/opencode-cli -Destination "$stage/vendor/opencode-cli"
          Copy-Item -Recurse -Path vendor/pi-cli -Destination "$stage/vendor/pi-cli"
          Copy-Item -Recurse -Path vendor/codex-cli -Destination "$stage/vendor/codex-cli"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.server_name }}.zip
          path: ${{ matrix.server_name }}.zip

  # Headless `claudeui-server` for linux x64 + arm64, each compiled host-natively
  # (arm64 hosted runners are free for public repos; bun cross-targets exist but
  # are unnecessary here). The tarball is runnable
  # as shipped: the compiled executable resolves its app path to the directory
  # holding `out/web`, and every engine looks up `vendor/<engine>-cli` under
  # that same root — so the linux opencode, pi and codex binaries that `bun
  # install`'s postinstall vendors on this runner ride along (Codex additionally
  # needs a system `bwrap` on the deployment box for its sandbox; see
  # docs/architecture/codex.md). `vendor/claude-cli` does NOT:
  # rebundle-cli is a documented clean skip for ELF (bun's ELF standalone layout
  # is unimplemented), so there is no patched linux bun-claude and the Claude
  # engine is missing from the LINUX artifact specifically — fail-closed rather
  # than silently unpatched. The mac and windows server zips assembled in the
  # `build` job above DO ship it, because those hosts can rebundle.
  server:
    name: Linux server build (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to match the other jobs — see the build matrix note.
          node-version: 24.15.0

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
            ${{ runner.os }}-bun-

      - name: Read claude CLI version
        id: cli-version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').claudeCliVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache claude CLI source binary
        uses: actions/cache@v6
        with:
          path: .cache/claude-cli
          # runner.arch matters: one fixed path per version, and an x64 ELF
          # restored onto the arm runner would be extracted as if native.
          key: ${{ runner.os }}-${{ runner.arch }}-claude-cli-src-${{ steps.cli-version.outputs.version }}

      - name: Read codex CLI version
        id: codex-version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').codexCliVersion")" >> "$GITHUB_OUTPUT"

      # No restore-keys: `cacheValid` rehashes every pinned payload, so a partial
      # hit from another pin is a guaranteed re-download rather than a saving.
      - name: Cache codex CLI binaries
        uses: actions/cache@v6
        with:
          path: vendor/codex-cli
          key: ${{ runner.os }}-${{ runner.arch }}-codex-cli-${{ steps.codex-version.outputs.version }}

      # postinstall downloads the Electron binary even though this job never
      # runs it; the os-only restore key hits ci.yml's ubuntu gates cache (the
      # store's files are arch-named, so cross-arch restore is additive).
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install

      - name: Stamp version into package.json
        run: |
          node -e "const p=require('./package.json'); p.version='${{ needs.version.outputs.version }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Build server executable
        run: |
          bun run build:web
          bun run build:server:compile
          ./dist/server-bin/claudeui-server --help > /dev/null

      # tar (not a bare upload): actions/upload-artifact strips the executable
      # bit, so modes survive only INSIDE the tarball, which is uploaded and
      # released as a single opaque file.
      - name: Assemble tarball
        run: |
          STAGE="claudeui-server-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir "$STAGE"
          cp -r dist/server-bin/. "$STAGE/"
          mkdir "$STAGE/vendor"
          cp -r vendor/opencode-cli "$STAGE/vendor/opencode-cli"
          cp -r vendor/pi-cli "$STAGE/vendor/pi-cli"
          cp -r vendor/codex-cli "$STAGE/vendor/codex-cli"
          tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claudeui-server-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          path: claudeui-server-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: [version, build, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ClaudeUI ${{ needs.version.outputs.tag }}
          body: |
            The `claudeui-server-*` artifacts are the headless server: linux x64 and
            arm64 as `.tar.gz`, macOS arm64 and Windows x64 as `.zip`. All four ship the
            opencode, pi and Codex engines. The mac and Windows zips also ship the Claude
            Code engine — the patched `bun-claude` builds on those hosts, and no linux
            one exists yet — and it signs in with whatever `claude` credentials already
            exist on that machine; the server manages no Claude account of its own.
            On linux, Codex's sandbox needs a system `bwrap` — install your distro's
            `bubblewrap` package, or sandboxed Codex commands fail.
            Unpack the mac zip with `unzip` or Finder so the executable bits survive
            (Python's `zipfile` drops them).

            ## Changes

            ${{ needs.version.outputs.changelog }}
          files: artifacts/*
          generate_release_notes: false
